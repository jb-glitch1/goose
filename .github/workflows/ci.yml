name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    name: Rust core (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Rust/core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Rust/core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Rust/core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build (all targets)
        run: cargo build --all-targets

      - name: Library unit tests
        run: cargo test --lib

      # The integration-test suite depends on generated/captured artifacts the
      # upstream repo does not commit (see docs/TEST-STATUS.md). The reference
      # adapters need Python; install it so those tests can run their
      # "unavailable" contract path.
      - name: Install Python (reference adapters)
        run: sudo apt-get update && sudo apt-get install -y python3

      - name: Reference adapter tests
        run: cargo test --test reference_tests --test reference_runner_cli_tests

  ios-app:
    name: iOS app (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain + iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-cargo-${{ hashFiles('Rust/core/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # Build with -target (not -scheme) so no shared Xcode scheme is required,
      # and disable signing for CI. This runs Scripts/build_ios_rust.sh as a
      # build phase, compiling the Rust staticlib for the simulator first.
      - name: Build iOS app (simulator, unsigned)
        run: |
          xcodebuild build \
            -project GooseSwift.xcodeproj \
            -target GooseSwift \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
          | xcpretty || xcodebuild build \
            -project GooseSwift.xcodeproj \
            -target GooseSwift \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
